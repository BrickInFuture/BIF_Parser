# Internal collector — raw market observations only.
# Kick-only: Firebase kickBifCollector every 30 min; kickBifDailyReport 19:59 UTC (23:59 Yerevan).
# No per-burst Telegram / no full KPI on burst (counters + daily report).

name: BIF collector

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "schedule = автопинк; owner = вручную"
        required: false
        default: "owner"
      mode:
        description: "burst | build_queues | daily_report | month_end | error_tail"
        required: false
        default: "burst"
      limit:
        description: "BL items per burst"
        required: false
        default: "60"
      owlLimit:
        description: "Owl items per burst"
        required: false
        default: "20"
      maxMinutes:
        description: "BL burst max minutes"
        required: false
        default: "20"

concurrency:
  group: ${{ github.event.inputs.mode == 'month_end' && 'bif-month-end' || github.event.inputs.mode == 'daily_report' && 'bif-daily-report' || 'bif-collector-public' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Gate
        id: check
        run: |
          d=$(date -u +%d)
          d=$((10#$d))
          mode="${{ github.event.inputs.mode || 'burst' }}"
          echo "UTC day=$d mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "month_end" ] || [ "$mode" = "daily_report" ] || [ "$mode" = "build_queues" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$d" -gt 26 ] && [ "${{ github.event.inputs.reason || 'owner' }}" = "schedule" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Schedule idle after day 26"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build_queues:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'build_queues'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Build month queues (BL + Owl)
        run: npm run ingest:month-queue -- --confirm --source=all

  ingest:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'burst'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
      BO_SKIP_BIF: "1"
      BL_PARSE_TIMEOUT_MS: "90000"
      BL_PAUSE_MS: "800,1600"
      BL_SOFT_BLOCK_FAST_MS: "3000"
      BL_CIRCUIT_SOFT_LIMIT: "5"
      BL_CIRCUIT_STOP: "0"
      BL_CIRCUIT_COOL_MIN_MS: "120000"
      BL_CIRCUIT_COOL_MAX_MS: "240000"
      BL_ADAPTIVE_PAUSE: "0"
      BL_CURRENT_MONTH_BUDGET: "60"
      BL_HISTORICAL_GAP_BUDGET: "0"
      BL_MONTH_QUEUE: "1"
      BL_MONTH_QUEUE_ERROR_BUDGET: "0"
      BL_GAP_SWEEP: "0"
      BL_HTTP_FETCH: "1"
      BL_HTTP_429_RETRIES: "1"
      BL_HTTP_429_MIN_MS: "15000"
      BL_HTTP_429_MAX_MS: "30000"
      BO_PAUSE_MS: "2000,4000"
      BL_PROXY_URL: ${{ secrets.BL_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright Chromium (from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: BrickLink burst
        env:
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          MAX_MINUTES: ${{ github.event.inputs.maxMinutes || '20' }}
        run: npm run ingest:catalog -- --confirm --phase=primary --limit="$LIMIT" --maxMinutes="$MAX_MINUTES"
      - name: Brick Owl burst
        if: success()
        continue-on-error: true
        env:
          BO_LIMIT: ${{ github.event.inputs.owlLimit || '20' }}
        run: npm run ingest:owl -- --confirm --limit="${{ github.event.inputs.owlLimit || '20' }}" --maxMinutes=12
      - name: User refresh queue
        if: success()
        continue-on-error: true
        run: npm run ingest:queue -- --confirm --limit=15 --maxMinutes=8

  error_tail:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'error_tail'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
      BL_MONTH_QUEUE: "1"
      BL_MONTH_QUEUE_ERROR_BUDGET: "40"
      BL_ERROR_RETRY_IMMEDIATE: "1"
      BL_PROXY_URL: ${{ secrets.BL_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright Chromium (from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Retry month-queue errors (tail)
        run: npm run ingest:catalog -- --confirm --phase=primary --limit=40 --maxMinutes=25
      - name: Retry observation errors
        continue-on-error: true
        run: npm run ingest:retry -- --confirm --phase=primary --limit=40 --maxMinutes=15

  daily_report:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'daily_report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Daily Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run notify:daily

  month_end:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'month_end'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
      BL_MONTH_QUEUE: "1"
      BL_MONTH_QUEUE_ERROR_BUDGET: "60"
      BL_ERROR_RETRY_IMMEDIATE: "1"
      BL_PROXY_URL: ${{ secrets.BL_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Error tail before month report
        continue-on-error: true
        run: npm run ingest:catalog -- --confirm --phase=primary --limit=60 --maxMinutes=20
      - name: Daily-style month summary (counters)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run notify:daily
