# Публичный парсер BrickLink — RAW-ONLY (пишет только sold/stock).
# Оценку BIF считает закрытая сторона (Cloud Function onMarketMonthlyWritten).
# Публичный репозиторий → безлимитные бесплатные минуты Actions.
#
# Нужен секрет FIREBASE_SERVICE_ACCOUNT_DEV (JSON сервис-аккаунта dev-проекта).
# Опционально: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, BL_PROXY_URL.

name: BrickLink parser (public, raw-only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max real scrapes per catalog chunk (SET+MINIFIG)"
        required: false
        default: "600"
      maxMinutes:
        description: "Catalog chunk max minutes"
        required: false
        default: "45"
  schedule:
    # 3×/сутки, дни 1–26 UTC = 78 окон/мес (публичный репо — минуты бесплатны).
    - cron: "0 5,13,21 1-26 * *"

concurrency:
  group: bricklink-parser-public
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
      BL_PARSE_TIMEOUT_MS: "90000"
      BL_PAUSE_MS: "800,1500"
      BL_SOFT_BLOCK_FAST_MS: "3000"
      BL_CIRCUIT_SOFT_LIMIT: "5"
      BL_CIRCUIT_COOL_MIN_MS: "90000"
      BL_CIRCUIT_COOL_MAX_MS: "180000"
      BL_ADAPTIVE_PAUSE: "0"
      BL_GAP_QUEUE_RATIO: "0.7"
      BL_HTTP_FETCH: "1"
      BL_HTTP_429_MIN_MS: "30000"
      BL_HTTP_429_MAX_MS: "60000"
      BL_PROXY_URL: ${{ secrets.BL_PROXY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_DEV"; exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Catalog ingest chunk (primary SET+MINIFIG, raw-only)
        env:
          LIMIT: ${{ github.event.inputs.limit || '600' }}
          MAX_MINUTES: ${{ github.event.inputs.maxMinutes || '45' }}
        run: npm run ingest:bricklink:catalog -- --confirm --phase=primary --limit="$LIMIT" --maxMinutes="$MAX_MINUTES"

      - name: Retry failed observations
        continue-on-error: true
        run: npm run ingest:bricklink:retry-errors -- --confirm --phase=primary --limit=60 --maxMinutes=10

      - name: User refresh queue
        run: npm run ingest:bricklink:queue -- --confirm --limit=15 --maxMinutes=8

      - name: Coverage KPI
        if: always()
        run: npm run ingest:bricklink:kpi -- --days=20 --write-run

      - name: Notify report (Telegram)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_CONCLUSION: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node bricklink-parser/notifyIngestReport.js
