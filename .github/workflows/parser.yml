# Internal collector — raw market observations only.
# Needs secret FIREBASE_SERVICE_ACCOUNT_DEV.
# Optional: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, BL_PROXY_URL.
#
# Kick-only: Firebase kickBifCollector every 30 min (workflow_dispatch).
# No on.schedule here — GHA cron duplicated kicks and cancelled in-progress runs.
# Days 1-26 UTC still enforced in kick + gate.
# mode=month_end → только KPI + итоговый отчёт за месяц (пинк 26-го ~23:00 UTC).

name: BIF collector

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "schedule = автопинк; owner = вручную (ты / агент)"
        required: false
        default: "owner"
      mode:
        description: "burst = обычный залп; month_end = итог месяца после дня 26"
        required: false
        default: "burst"
      limit:
        description: "Max items per short burst (SET→MINIFIG→GEAR); stay under IP heat (~60)"
        required: false
        default: "60"
      maxMinutes:
        description: "Catalog burst max minutes (cool-and-continue needs headroom under job timeout)"
        required: false
        default: "20"

concurrency:
  group: ${{ github.event.inputs.mode == 'month_end' && 'bif-month-end' || 'bif-collector-public' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Days 1-26 UTC for schedule
        id: check
        run: |
          d=$(date -u +%d)
          d=$((10#$d))
          mode="${{ github.event.inputs.mode || 'burst' }}"
          echo "UTC day=$d event=${{ github.event_name }} mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "month_end" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$d" -gt 26 ] && [ "${{ github.event.inputs.reason || 'owner' }}" = "schedule" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Schedule idle after day 26"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode != 'month_end'
    runs-on: ubuntu-latest
    # setup (~2) + catalog max 20 (+ cool overrun) + retry 3 + queue 8 + KPI (~3)
    timeout-minutes: 45
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
      BL_PARSE_TIMEOUT_MS: "90000"
      BL_PAUSE_MS: "800,1600"
      BL_SOFT_BLOCK_FAST_MS: "3000"
      BL_CIRCUIT_SOFT_LIMIT: "5"
      BL_CIRCUIT_STOP: "0"
      BL_CIRCUIT_COOL_MIN_MS: "120000"
      BL_CIRCUIT_COOL_MAX_MS: "240000"
      BL_ADAPTIVE_PAUSE: "0"
      BL_CURRENT_MONTH_BUDGET: "50"
      BL_HISTORICAL_GAP_BUDGET: "10"
      BL_HTTP_FETCH: "1"
      BL_HTTP_429_RETRIES: "1"
      BL_HTTP_429_MIN_MS: "15000"
      BL_HTTP_429_MAX_MS: "30000"
      BL_PROXY_URL: ${{ secrets.BL_PROXY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm install

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright Chromium (from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_DEV"; exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Catalog ingest chunk
        env:
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          MAX_MINUTES: ${{ github.event.inputs.maxMinutes || '20' }}
        run: npm run ingest:catalog -- --confirm --phase=primary --limit="$LIMIT" --maxMinutes="$MAX_MINUTES"

      - name: Retry failed observations
        if: success()
        continue-on-error: true
        run: npm run ingest:retry -- --confirm --phase=primary --limit=10 --maxMinutes=3

      - name: User refresh queue
        if: success()
        continue-on-error: true
        run: npm run ingest:queue -- --confirm --limit=15 --maxMinutes=8

      - name: Coverage KPI
        if: always()
        run: npm run ingest:kpi -- --days=28 --write-run

      - name: Notify report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_CONCLUSION: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BL_RUN_REASON: ${{ github.event.inputs.reason || '' }}
        run: node collector/notifyIngestReport.js

  month_end:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'month_end'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm install

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_DEV"; exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Coverage KPI
        run: npm run ingest:kpi -- --days=28 --write-run

      - name: Month-end report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node collector/notifyMonthEndReport.js
