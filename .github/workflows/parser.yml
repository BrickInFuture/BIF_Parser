# Internal collector — raw market observations only.
# Needs secret FIREBASE_SERVICE_ACCOUNT_DEV.
# Optional: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, BL_PROXY_URL.
#
# One cron per workflow file (hourly). Two files (A@:18 B@:48) ~= every 30 min.
# Dense multi-cron in a single file was dropping after a few fires on this repo.
# Days 1-26 UTC enforced in job "gate".

name: BIF collector

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "schedule = auto kick; owner = manual"
        required: false
        default: "owner"
      limit:
        description: "Max items per short burst (SET+MINIFIG); stay under IP heat (~60)"
        required: false
        default: "60"
      maxMinutes:
        description: "Catalog burst max minutes"
        required: false
        default: "15"

concurrency:
  group: bif-collector-public
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Days 1-26 UTC for schedule
        id: check
        run: |
          d=$(date -u +%d)
          d=$((10#$d))
          echo "UTC day=$d event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$d" -gt 26 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Schedule idle after day 26"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEV_PROJECT_ID: brickinfuture-306f1
      BL_RAW_ONLY: "1"
      BL_PARSE_TIMEOUT_MS: "90000"
      BL_PAUSE_MS: "400,800"
      BL_SOFT_BLOCK_FAST_MS: "3000"
      BL_CIRCUIT_SOFT_LIMIT: "5"
      BL_CIRCUIT_STOP: "1"
      BL_CIRCUIT_COOL_MIN_MS: "60000"
      BL_CIRCUIT_COOL_MAX_MS: "120000"
      BL_ADAPTIVE_PAUSE: "0"
      BL_GAP_QUEUE_RATIO: "0.7"
      BL_HTTP_FETCH: "1"
      BL_HTTP_429_RETRIES: "1"
      BL_HTTP_429_MIN_MS: "15000"
      BL_HTTP_429_MAX_MS: "30000"
      BL_PROXY_URL: ${{ secrets.BL_PROXY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm install

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright Chromium (from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_DEV"; exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Catalog ingest chunk
        env:
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          MAX_MINUTES: ${{ github.event.inputs.maxMinutes || '15' }}
        run: npm run ingest:catalog -- --confirm --phase=primary --limit="$LIMIT" --maxMinutes="$MAX_MINUTES"

      - name: Retry failed observations
        continue-on-error: true
        run: npm run ingest:retry -- --confirm --phase=primary --limit=10 --maxMinutes=3

      - name: User refresh queue
        run: npm run ingest:queue -- --confirm --limit=15 --maxMinutes=8

      - name: Coverage KPI
        if: always()
        run: npm run ingest:kpi -- --days=28 --write-run

      - name: Notify report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_CONCLUSION: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BL_RUN_REASON: ${{ github.event.inputs.reason || '' }}
        run: node collector/notifyIngestReport.js
